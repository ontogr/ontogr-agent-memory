name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  release-on-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check distribution versions and files
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/check_distribution.py

      - name: Build distributions
        run: |
          uv build
          uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*

      - name: Verify the wheel imports from a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheelenv"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheelenv/bin/python" -c "import ontogr_mem; print(ontogr_mem.__version__)"

      - name: Publish on PyPI
        run: uv publish --trusted-publishing always

  publish-image:
    name: Publish container image
    needs: release-on-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this is a final release
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'final=true' >> "$GITHUB_OUTPUT"
          else
            echo 'final=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/ontogr/ontogr-agent-memory
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ steps.tag.outputs.final == 'true' }}
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
