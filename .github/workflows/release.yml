name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  release-on-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version in pyproject.toml"
            exit 1
          fi

      - name: Build distributions
        run: |
          uv build
          uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*

      - name: Verify the wheel imports from a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheelenv"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheelenv/bin/python" -c "import ontogr_mem; print(ontogr_mem.__version__)"

      - name: Publish on PyPI
        run: uv publish --trusted-publishing always
