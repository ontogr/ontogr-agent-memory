name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'active' }}-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  integration:
    name: Integration (${{ matrix.suite.name }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Each entry is one module and runs as its own job on its own runner
        # with its own ephemeral services, so the entries run in parallel and
        # no two share a database. services lists the compose services the
        # module uses: falkordb, neo4j and relational. A test that
        # needs a service that is not running fails, so keep the list exact.
        # The small access and observability modules share one job
        # because a runner costs more to start than they take to run.
        suite:
          - name: graphstore
            paths: tests/integration/graphstore
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: vectorstore
            paths: tests/integration/vectorstore
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: temporal
            paths: tests/integration/temporal
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: consolidation
            paths: tests/integration/consolidation
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: relational-store
            paths: tests/integration/relational_store
            services: falkordb neo4j relational
            workers: "0"
            timeout: 15
          - name: access-observability
            paths: tests/integration/access tests/integration/observability
            services: ""
            timeout: 10
          # Neighbourhood traversal tests.
          - name: service-neighbourhood
            paths: tests/integration/test_neighbourhood.py
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          # Retrieval and ablation tests.
          - name: service-retrieval
            paths: tests/integration/retrieval tests/integration/test_retrieval_ablation.py
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          # Client, resolution, and core memory service tests.
          - name: service-client-resolution
            paths: tests/integration/client tests/integration/resolution tests/integration/test_memory_service.py
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: journey
            paths: tests/integration/journey
            services: falkordb
            workers: "0"
            timeout: 20
          # Everything the entries above do not claim: the service and pipeline
          # tests at the top of tests/integration, and any module added later.
          - name: service
            paths: >-
              tests/integration
              --ignore=tests/integration/graphstore
              --ignore=tests/integration/vectorstore
              --ignore=tests/integration/temporal
              --ignore=tests/integration/consolidation
              --ignore=tests/integration/relational_store
              --ignore=tests/integration/access
              --ignore=tests/integration/llm
              --ignore=tests/integration/observability
              --ignore=tests/integration/test_neighbourhood.py
              --ignore=tests/integration/retrieval
              --ignore=tests/integration/test_retrieval_ablation.py
              --ignore=tests/integration/client
              --ignore=tests/integration/resolution
              --ignore=tests/integration/test_memory_service.py
              --ignore=tests/integration/journey
            services: falkordb neo4j
            workers: "0"
            timeout: 30
    env:
      UV_PYTHON: "3.12"
      # Throwaway values for the databases that tests/integration/compose.yaml
      # starts on this runner. They are not secrets and are not used elsewhere.
      SERVICES: ${{ matrix.suite.services }}
      INTEGRATION_PATHS: ${{ matrix.suite.paths }}
      # pytest-xdist workers. The default is one per core, and 0 runs in one
      # process. FalkorDB v4.22 can crash with a segmentation fault when two
      # clients create indexes at the same moment, and the Postgres tests
      # truncate shared tables, so those modules run in one process.
      INTEGRATION_WORKERS: ${{ matrix.suite.workers || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Restore FastEmbed model cache
        if: matrix.suite.name == 'journey'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-BAAI-bge-small-en-v1.5
      - name: Start the test services
        if: matrix.suite.services != ''
        run: make services-up SERVICES="$SERVICES"
      - name: Generate container API key
        if: matrix.suite.name == 'journey'
        run: echo "MEMORY_MCP_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
      - name: Build the container image
        if: matrix.suite.name == 'journey'
        run: make image-build IMAGE=ontogr-agent-memory:ci
      - name: Start the container image
        if: matrix.suite.name == 'journey'
        run: make image-up IMAGE=ontogr-agent-memory:ci
      - name: Run integration tests
        # Stops a hung run early enough for the service logs below to upload.
        timeout-minutes: 25
        run: make test-integration INTEGRATION_PATHS="$INTEGRATION_PATHS" INTEGRATION_WORKERS="$INTEGRATION_WORKERS"
      - name: Stop the container image
        if: ${{ always() && matrix.suite.name == 'journey' }}
        run: make image-down IMAGE=ontogr-agent-memory:ci
      - name: Show service logs
        if: failure() && matrix.suite.services != ''
        run: |
          docker compose -f tests/integration/compose.yaml ps -a
          docker inspect --format '{{.Name}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' $(docker compose -f tests/integration/compose.yaml ps -aq)
          free -m
          docker compose -f tests/integration/compose.yaml logs --no-color falkordb | grep -A45 'BUG REPORT START' || true
          docker compose -f tests/integration/compose.yaml logs --no-color --tail 100
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration
          name: codecov-integration-${{ matrix.suite.name }}
          fail_ci_if_error: false
          slug: ontogr/ontogr-agent-memory
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-integration-results-${{ matrix.suite.name }}
          path: |
            pytest-integration-results.xml
            journey-result.json
          retention-days: 30
