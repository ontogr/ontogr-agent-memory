name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      # Throwaway values for the databases that tests/integration/compose.yaml
      # starts on this runner. They are not secrets and are not used elsewhere.
      MEMORY_FALKORDB_HOST: localhost
      MEMORY_FALKORDB_PORT: "16379"
      MEMORY_NEO4J_URI: bolt://localhost:17687
      MEMORY_NEO4J_USERNAME: neo4j
      MEMORY_NEO4J_PASSWORD: memorytest123
      MEMORY_PGVECTOR_DSN: postgresql://memory:memorytest123@localhost:15432/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Start the test services
        run: make services-up
      - name: Run integration tests
        run: make test-integration
      - name: Show service logs
        if: failure()
        run: docker compose -f tests/integration/compose.yaml logs --no-color --tail 200
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-integration-results
          path: pytest-integration-results.xml
          retention-days: 30
