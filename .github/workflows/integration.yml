name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Each entry is one module and runs as its own job on its own runner
        # with its own ephemeral services, so the entries run in parallel and
        # no two share a database. services lists the compose services the
        # module uses: falkordb, neo4j, pgvector and relational. A test that
        # needs a service that is not running fails, so keep the list exact.
        # The small access, llm and observability modules share one job
        # because a runner costs more to start than they take to run.
        suite:
          - name: graphstore
            paths: tests/integration/graphstore
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: vectorstore
            paths: tests/integration/vectorstore
            services: falkordb neo4j pgvector
            workers: "0"
            timeout: 15
          - name: temporal
            paths: tests/integration/temporal
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: consolidation
            paths: tests/integration/consolidation
            services: falkordb neo4j
            workers: "0"
            timeout: 15
          - name: relational-store
            paths: tests/integration/relational_store
            services: relational
            workers: "0"
            timeout: 15
          - name: access-llm-observability
            paths: tests/integration/access tests/integration/llm tests/integration/observability
            services: ""
            timeout: 10
          # Everything the entries above do not claim: the service and pipeline
          # tests at the top of tests/integration, and any module added later.
          - name: service
            paths: >-
              tests/integration
              --ignore=tests/integration/graphstore
              --ignore=tests/integration/vectorstore
              --ignore=tests/integration/temporal
              --ignore=tests/integration/consolidation
              --ignore=tests/integration/relational_store
              --ignore=tests/integration/access
              --ignore=tests/integration/llm
              --ignore=tests/integration/observability
            services: falkordb neo4j
            workers: "0"
            timeout: 20
    env:
      UV_PYTHON: "3.12"
      # Throwaway values for the databases that tests/integration/compose.yaml
      # starts on this runner. They are not secrets and are not used elsewhere.
      MEMORY_FALKORDB_HOST: localhost
      MEMORY_FALKORDB_PORT: "16379"
      MEMORY_NEO4J_URI: bolt://localhost:17687
      MEMORY_NEO4J_USERNAME: neo4j
      MEMORY_NEO4J_PASSWORD: memorytest123
      MEMORY_PGVECTOR_DSN: postgresql://memory:memorytest123@localhost:15432/memory
      SERVICES: ${{ matrix.suite.services }}
      INTEGRATION_PATHS: ${{ matrix.suite.paths }}
      # pytest-xdist workers. The default is one per core, and 0 runs in one
      # process. FalkorDB v4.22 can crash with a segmentation fault when two
      # clients create indexes at the same moment, and the Postgres tests
      # truncate shared tables, so those modules run in one process.
      INTEGRATION_WORKERS: ${{ matrix.suite.workers || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Start the test services
        if: matrix.suite.services != ''
        run: make services-up SERVICES="$SERVICES"
      - name: Run integration tests
        # Stops a hung run early enough for the service logs below to upload.
        timeout-minutes: 15
        run: make test-integration INTEGRATION_PATHS="$INTEGRATION_PATHS" INTEGRATION_WORKERS="$INTEGRATION_WORKERS"
      - name: Show service logs
        if: failure() && matrix.suite.services != ''
        run: |
          docker compose -f tests/integration/compose.yaml ps -a
          docker inspect --format '{{.Name}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' $(docker compose -f tests/integration/compose.yaml ps -aq)
          free -m
          docker compose -f tests/integration/compose.yaml logs --no-color falkordb | grep -A45 'BUG REPORT START' || true
          docker compose -f tests/integration/compose.yaml logs --no-color --tail 100
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration
          name: codecov-integration-${{ matrix.suite.name }}
          fail_ci_if_error: false
          slug: ontogr/ontogr-agent-memory
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-integration-results-${{ matrix.suite.name }}
          path: pytest-integration-results.xml
          retention-days: 30
