name: Docs snippets

on:
  push:
    branches:
      - main
    paths:
      - "docs/docs/**"
      - "docs/conftest.py"
      - "ontogr_mem/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/docs-snippets.yml"
  pull_request:
    paths:
      - "docs/docs/**"
      - "docs/conftest.py"
      - "ontogr_mem/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/docs-snippets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  snippets:
    name: Run docs code blocks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make sync
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/fastembed-cache
          key: fastembed-${{ hashFiles('uv.lock') }}
      - name: Run docs code blocks
        env:
          DOCS_TEST_DATA_ROOT: ${{ runner.temp }}/ontogr-docs-data
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed-cache
        run: make docs-test
      - name: Stop every page server
        if: always()
        run: |
          for dir in "$RUNNER_TEMP"/ontogr-docs-data/*; do
            [ -d "$dir" ] || continue
            MEMORY_DATA_DIR="$dir" uv run ontogr-mem server stop || true
          done
      - name: Upload snippet results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-snippets-results
          path: docs-snippets-results.xml
          if-no-files-found: warn
