[extend]
useDefault = true

[allowlist]
description = "Exclude generated output, local tooling data, result-record hashes, and a test fixture."
regexTarget = "line"
regexes = [
    '''^\s*\("key=mk_abcdefghijklmnopqrstuvwxyz1234", "key=mk_\*\*\*"\),$''',
]
paths = [
    '''benchmarks/results/.*/record\.json''',
    '''(^|/)(\.venv|\.wheelenv|venv)/''',
    '''^(\./)?(build|dist)/''',
    '''^(\./)?docs/(node_modules|build|\.docusaurus)/''',
    '''(^|/)(__pycache__|\.pytest_cache|\.ruff_cache|\.cache|\.deepeval)/''',
    '''(^|/)\.amp/in/''',
]
