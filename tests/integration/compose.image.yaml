services:
  mcp:
    image: ${ONTOGR_MEM_IMAGE}
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      MEMORY_GRAPH_URL: redis://falkordb:6379
      MEMORY_STATE_URL: sqlite:////data/state/agent_memory_state.sqlite3
      MEMORY_DATA_DIR: /data/state
      MEMORY_MCP_TENANT: journey_container
      MEMORY_MCP_API_KEY: ${MEMORY_MCP_API_KEY:?set a throwaway key for this run}
    ports: ["127.0.0.1:18000:8000"]
