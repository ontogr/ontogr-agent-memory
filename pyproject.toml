[build-system]
requires = ["uv_build>=0.11.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ontogr-mem"
version = "0.0.1"
description = "Durable, traceable memory for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent-memory", "ai-agents", "memory", "provenance"]
authors = [
  { name = "Ashwin Mathur", email = "ashwinm400@gmail.com" },
  { name = "Varun Mathur", email = "varunm500@gmail.com" },
]
maintainers = [
  { name = "Ashwin Mathur", email = "ashwinm400@gmail.com" },
  { name = "Varun Mathur", email = "varunm500@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
falkordb = ["falkordb>=1.2", "redis>=5.0.1"]
neo4j = ["neo4j>=6"]
pgvector = ["asyncpg>=0.30"]
postgres = ["asyncpg>=0.30"]
rdf = ["rdflib>=7"]
gliner = ["gliner>=0.2", "torch"]
spacy = ["spacy>=3.7"]
yaml = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.30"]

[project.urls]
Homepage = "https://github.com/ontogr/ontogr-agent-memory"
Source = "https://github.com/ontogr/ontogr-agent-memory"
Changelog = "https://github.com/ontogr/ontogr-agent-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/ontogr/ontogr-agent-memory/issues"

[tool.uv.build-backend]
module-root = ""
module-name = "ontogr_mem"

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.23"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "coverage[toml]>=7.13.0",
  "opentelemetry-sdk>=1.30",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-rerunfailures>=16.2",
  "pytest-socket>=0.7.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.10",
  "ty>=0.0.32",
  "typos>=1.51.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "pyproject.toml", "*.ipynb"]
extend-exclude = ["thoughts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "COM", # flake8-commas
  "C4",  # flake8-comprehensions
  "C901", # mccabe complexity
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "ICN", # flake8-import-conventions
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle
  "N",   # pep8-naming
  "ERA", # eradicate
  "PL",  # pylint
  "TID", # flake8-tidy-imports
]
ignore = [
  "PLR2004", # Replace magic number with named constant
  "COM812",  # Trailing comma missing (conflicts with the formatter)
  "PLR0913", # Too many arguments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"tests/**/*.py" = ["N802", "N999", "TID251"]
"ontogr_mem/graphstore/**" = ["TID251"]
"ontogr_mem/vectorstore/graph/**" = ["TID251"]
"ontogr_mem/vectorstore/pgvector/**" = ["TID251"]
"ontogr_mem/relational_store/**" = ["TID251", "PLC0415"]
# Composes the graph adapters on purpose and loads each driver only when selected.
"ontogr_mem/service/bootstrap.py" = ["TID251", "PLC0415"]
# Defines graph schema parts that the graph-backed vector stores consume.
"ontogr_mem/vectorstore/schema.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"falkordb".msg = "Import falkordb only inside ontogr_mem/graphstore/falkordb."
"redis".msg = "Import redis only inside ontogr_mem/graphstore/falkordb."
"neo4j".msg = "Import neo4j only inside ontogr_mem/graphstore/neo4j."
"asyncpg".msg = "Import asyncpg only inside ontogr_mem/vectorstore/pgvector or ontogr_mem/relational_store."
"ontogr_mem.graphstore".msg = "Components reach graph storage only through their own port."

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["ontogr_mem"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/unit"]
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket -q -ra -n auto --dist loadscope"
markers = [
  "integration: Integration test that requires external services (databases, APIs)",
  "slow: Slow running tests",
  "enable_socket: Allow socket connections (auto-applied to integration tests)",
  "flaky: Re-run flaky tests up to N times",
]
log_cli = false
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["ontogr_mem"]
omit = ["tests/*", "*/__init__.py"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.ty.environment]
root = [".", "tests"]

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[tool.bandit]
exclude_dirs = ["/tests", "/.venv", "/build", "/dist"]
skips = ["B101"]

[tool.typos.files]
# Fixtures under tests/**/fixtures/ hold deliberately odd bytes and words that
# exercise edge cases. thoughts/ holds research notes and reference material, not
# this project's own prose (see the matching [tool.ruff] extend-exclude).
extend-exclude = [
  "tests/**/fixtures/**",
  "thoughts/**",
]

[tool.typos.default.extend-words]
# Person name used in labelled evaluation data.
Ned = "Ned"
# Deliberately misspelled status passed to Validity to show the rejection.
activ = "activ"
# Unmatched label input in a resolution test; changing it changes the result.
nknown = "nknown"
