<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contradiction-handling-title contradiction-handling-desc" id="contradiction-handling-root">
<title id="contradiction-handling-title">Contradiction handling</title>
<desc id="contradiction-handling-desc">Observations in one slot go to the rules when the relation is single-valued. Pairs from other slots go to an optional model judge, which stores its verdicts. The handler reads the rules and the stored verdicts, and a person's decision overrides both. The result is a set of slot directives that the engine commits as fact versions.</desc>
<defs>
      <style>#contradiction-handling-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #contradiction-handling-root { font-family: var(--font-sans); color: var(--color-ink); }
      #contradiction-handling-root .diagram-container { width: 100%; overflow-x: auto; }
      #contradiction-handling-root .diagram-container { overflow-x: visible; }
      #contradiction-handling-root .n-name { font:600 12px 'Geist', system-ui, sans-serif;fill:#2d3142 }
      #contradiction-handling-root .n-name-sm { font:500 11px 'Geist', system-ui, sans-serif;fill:#2d3142 }
      #contradiction-handling-root .n-sub { font:400 9px 'Geist Mono', ui-monospace, monospace;fill:#5a6580 }
      #contradiction-handling-root .ey { font:500 8px 'Geist Mono', ui-monospace, monospace;letter-spacing:.18em;fill:#5a6580 }
      #contradiction-handling-root .al { font:400 8px 'Geist Mono', ui-monospace, monospace;letter-spacing:.06em;fill:#4f5d75 }
      #contradiction-handling-root .al-accent { font:400 8px 'Geist Mono', ui-monospace, monospace;letter-spacing:.06em;fill:#bf4520 }
      #contradiction-handling-root .callout { font:italic 400 14px 'Instrument Serif', serif;fill:#4f5d75 }
      #contradiction-handling-root .tag-t { font:500 8px 'Geist Mono', ui-monospace, monospace;letter-spacing:.08em;fill:#4f5d75 }
      #contradiction-handling-root .k-backend { fill:#ffffff;stroke:#2d3142;stroke-width:1 }
      #contradiction-handling-root .k-store { fill:rgba(45,49,66,0.05);stroke:#4f5d75;stroke-width:1 }
      #contradiction-handling-root .k-focal { fill:rgba(191,69,32,0.08);stroke:#bf4520;stroke-width:1.2 }
      #contradiction-handling-root .k-input { fill:rgba(79,93,117,0.10);stroke:#5a6580;stroke-width:1 }
      #contradiction-handling-root .k-external { fill:rgba(45,49,66,0.03);stroke:rgba(45,49,66,0.30);stroke-width:1 }
      #contradiction-handling-root .k-optional { fill:rgba(45,49,66,0.02);stroke:rgba(45,49,66,0.20);stroke-width:1;stroke-dasharray:4 3 }
      #contradiction-handling-root .k-security { fill:rgba(191,69,32,0.05);stroke:rgba(191,69,32,0.50);stroke-width:1;stroke-dasharray:4 4 }
      #contradiction-handling-root .zone { fill:rgba(45,49,66,0.03);stroke:#bfc0c0;stroke-width:1 }
      #contradiction-handling-root .zone-dash { fill:none;stroke:#bfc0c0;stroke-width:1;stroke-dasharray:4 4 }
      #contradiction-handling-root .row { fill:#ffffff;stroke:rgba(45,49,66,0.12);stroke-width:1 }
      #contradiction-handling-root .tag { fill:rgba(45,49,66,0.04);stroke:rgba(45,49,66,0.30);stroke-width:0.8 }
      #contradiction-handling-root .e { fill:none;stroke:#4f5d75;stroke-width:1 }
      #contradiction-handling-root .e-accent { fill:none;stroke:#bf4520;stroke-width:1.2 }
      #contradiction-handling-root .e-link { fill:none;stroke:#2e5aa8;stroke-width:1 }
      #contradiction-handling-root .e-dash { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:5 4 }
      #contradiction-handling-root .e-dash-accent { fill:none;stroke:#bf4520;stroke-width:1.2;stroke-dasharray:5 4 }
      #contradiction-handling-root .guide { fill:none;stroke:#2e5aa8;stroke-width:1;stroke-dasharray:2 4 }
      #contradiction-handling-root .tick { fill:none;stroke:#bf4520;stroke-width:2 }
      #contradiction-handling-root .mask { fill:#f5f5f5 }
      #contradiction-handling-root .dot { fill:#2d3142 }
      #contradiction-handling-root .n-sub-accent { font:400 9px 'Geist Mono', ui-monospace, monospace;fill:#bf4520 }</style><marker id="contradiction-handling-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="contradiction-handling-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="contradiction-handling-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path class="e" d="M172 184L196 184Q204 184 204 176L204 88Q204 80 212 80L240 80" marker-end="url(#contradiction-handling-arrow)"/>
<path class="e-dash" d="M172 216L196 216Q204 216 204 224L204 340Q204 348 212 348L240 348" marker-end="url(#contradiction-handling-arrow)"/>
<path class="e" d="M432 348L496 348" marker-end="url(#contradiction-handling-arrow)"/>
<g><rect class="mask" x="440.75" y="329" width="46.5" height="12"/><text class="al" x="464" y="338" text-anchor="middle">RECORDS</text></g>
<path class="e" d="M432 72L680 72Q688 72 688 80L688 188Q688 196 696 196L752 196" marker-end="url(#contradiction-handling-arrow)"/>
<g><rect class="mask" x="539.5" y="53" width="41" height="12"/><text class="al" x="560" y="62" text-anchor="middle">RULING</text></g>
<path class="e" d="M680 344L712 344Q720 344 720 336L720 232Q720 224 728 224L752 224" marker-end="url(#contradiction-handling-arrow)"/>
<path class="e-accent" d="M844 112L844 184" marker-end="url(#contradiction-handling-arrow-accent)"/>
<text class="al-accent" x="852" y="152" text-anchor="start">OVERRIDES</text>
<path class="e" d="M844 248L844 336" marker-end="url(#contradiction-handling-arrow)"/>
<text class="al" x="852" y="296" text-anchor="start">COMMIT</text>
<g><rect class="k-input" x="24" y="168" width="148" height="64" rx="6"/><text class="n-name" x="36" y="198">Observations</text><text class="n-sub" x="36" y="212">in one slot</text></g>
<g><rect class="k-backend" x="240" y="48" width="192" height="64" rx="6"/><text class="n-name" x="252" y="71">Rules</text><text class="n-sub" x="252" y="85">single-valued relations</text><text class="n-sub" x="252" y="99">same slot</text></g>
<g><rect class="k-optional" x="240" y="312" width="192" height="72" rx="6"/><text class="n-name" x="252" y="339">Model judge</text><text class="n-sub" x="252" y="353">cross-slot pairs</text><text class="n-sub" x="252" y="367">two passes, sides swapped</text></g>
<g><rect class="k-store" x="496" y="312" width="184" height="64" rx="6"/><text class="n-name" x="508" y="342">Stored verdicts</text><text class="n-sub" x="508" y="356">keyed by pair and inputs</text></g>
<g><rect class="k-focal" x="752" y="48" width="184" height="64" rx="6"/><text class="n-name" x="764" y="78">Person's decision</text><text class="n-sub" x="764" y="92">record_decision</text></g>
<g><rect class="k-backend" x="752" y="184" width="184" height="64" rx="6"/><text class="n-name" x="764" y="214">Slot directives</text><text class="n-sub" x="764" y="228">close, open, conflict</text></g>
<g><rect class="k-store" x="752" y="336" width="184" height="64" rx="6"/><text class="n-name" x="764" y="366">Fact versions</text><text class="n-sub" x="764" y="380">with a ledger entry</text></g>
<text class="callout" x="24" y="432" text-anchor="start">A verdict is update, correction, dispute, or uncertain.</text>
<text class="callout" x="24" y="452" text-anchor="start">A failed judge call is retried and never stored as no contradiction.</text>
</svg>
