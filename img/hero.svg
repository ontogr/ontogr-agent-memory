      #hero-root .zone-dash { fill:none;stroke:#bfc0c0;stroke-width:1;stroke-dasharray:4 4 }
      #hero-root .row { fill:#ffffff;stroke:rgba(45,49,66,0.12);stroke-width:1 }
      #hero-root .tag { fill:rgba(45,49,66,0.04);stroke:rgba(45,49,66,0.30);stroke-width:0.8 }
      #hero-root .e { fill:none;stroke:#4f5d75;stroke-width:1 }
      #hero-root .e-accent { fill:none;stroke:#bf4520;stroke-width:1.2 }
      #hero-root .e-link { fill:none;stroke:#2e5aa8;stroke-width:1 }
      #hero-root .e-dash { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:5 4 }
      #hero-root .e-dash-accent { fill:none;stroke:#bf4520;stroke-width:1.2;stroke-dasharray:5 4 }
      #hero-root .guide { fill:none;stroke:#2e5aa8;stroke-width:1;stroke-dasharray:2 4 }
      #hero-root .tick { fill:none;stroke:#bf4520;stroke-width:2 }
      #hero-root .mask { fill:#f5f5f5 }
      #hero-root .dot { fill:#2d3142 }
      #hero-root .n-sub-accent { font:400 9px 'Geist Mono', ui-monospace, monospace;fill:#bf4520 }</style><marker id="hero-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="hero-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="hero-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
