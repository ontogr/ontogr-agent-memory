services:
  falkordb:
    image: falkordb/falkordb:v4.22.2
    environment:
      BROWSER: "0"
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - ontogr-mem-falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp:
    image: ghcr.io/ontogr/ontogr-agent-memory:${ONTOGR_MEM_VERSION:-0.0.1}
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # The graph host is not loopback, so the server needs a named tenant.
    # Set MEMORY_MCP_TENANT when you override MEMORY_GRAPH_URL.
    environment:
      MEMORY_GRAPH_URL: redis://falkordb:6379
      MEMORY_STATE_URL: sqlite:////data/state/agent_memory_state.sqlite3
      MEMORY_DATA_DIR: /data/state
      FASTEMBED_CACHE_PATH: /data/models
      MEMORY_EMBEDDING_PROVIDER: null
      MEMORY_EMBEDDING_MODEL: null
      MEMORY_EMBEDDING_BASE_URL: null
      MEMORY_EMBEDDING_API_KEY: null
      MEMORY_EMBEDDING_DIMENSIONS: null
      MEMORY_EMBEDDING_MAX_INPUT_TOKENS: null
      MEMORY_EMBEDDING_FASTEMBED_KWARGS: null
      MEMORY_EMBEDDING_BATCH_SIZE: null
      MEMORY_MCP_API_KEY: ${MEMORY_MCP_API_KEY:-}
      MEMORY_MCP_TENANT: ${MEMORY_MCP_TENANT:-local}
      MEMORY_MCP_TOOLS: ${MEMORY_MCP_TOOLS-search_memory,get_entity,list_entities,get_ontology,get_job,add_memory,write_facts,forget_memory,get_skill}
      MEMORY_MCP_SKILLS_EXTENSION: ${MEMORY_MCP_SKILLS_EXTENSION:-true}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
    volumes:
      - ontogr-mem-state:/data/state
      - ontogr-mem-models:/data/models
    stop_grace_period: 5m

volumes:
  ontogr-mem-falkordb-data:
    name: ontogr-mem-falkordb-data
  ontogr-mem-state:
    name: ontogr-mem-state
  ontogr-mem-models:
    name: ontogr-mem-models
