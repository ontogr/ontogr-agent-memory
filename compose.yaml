services:
  falkordb:
    image: falkordb/falkordb:v4.22.2
    environment:
      BROWSER: "0"
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
